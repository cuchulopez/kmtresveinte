<style>
/* Layout: exercise book — sticky crayon tab strip, one test per page, activities as numbered blocks on a ruled sheet */
:root{
  --paper:#fbfcff; --sheet:#ffffff; --ink:#1f2a44; --muted:#5d6785; --rule:#d9e2f2; --margin:#f2a7a7;
  --a:#d9433b; --b:#2f9a52; --c:#d69a00; --d:#2f6fd6; --e:#8a4fc9;
  --accent:var(--d); --chip:#eef3fc;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Verdana",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12172a; --sheet:#1a2036; --ink:#e8ecf7; --muted:#a3acc7; --rule:#2c3552; --margin:#7a3b45;
  --a:#ff7a6e; --b:#5fd08a; --c:#f2c14e; --d:#78a6ff; --e:#c49bff; --chip:#242c48; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12172a; --sheet:#1a2036; --ink:#e8ecf7; --muted:#a3acc7; --rule:#2c3552; --margin:#7a3b45;
  --a:#ff7a6e; --b:#5fd08a; --c:#f2c14e; --d:#78a6ff; --e:#c49bff; --chip:#242c48; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 1.05rem/1.6 var(--body);padding:0 16px}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 48px;display:grid;gap:18px}
header h1{font:800 clamp(1.7rem,5vw,2.4rem)/1.1 var(--display);margin:0;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);max-width:62ch}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:8px;display:flex;gap:8px;overflow-x:auto}
nav button{flex:0 0 auto;font:700 1rem var(--display);border:2px solid var(--tc);color:var(--tc);background:var(--sheet);border-radius:999px;padding:6px 14px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--tc);color:var(--sheet)}
nav button:focus-visible,.opt:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-top:8px solid var(--accent);border-radius:6px;padding:20px clamp(16px,4vw,36px);display:grid;gap:22px;min-width:0}
.sheet h2{font:800 clamp(1.4rem,4vw,1.9rem)/1.15 var(--display);margin:0;color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:10px 22px;color:var(--muted)}
.meta label{display:flex;gap:6px;align-items:baseline}
.act{display:grid;gap:8px;min-width:0;padding-left:14px;border-left:3px solid var(--margin)}
.act h3{font:800 1.12rem/1.3 var(--display);margin:0}
.act h3 .n{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--accent);color:var(--sheet);margin-right:8px;font-size:.9em}
.act p,.act ol{margin:0}
.act ol{padding-left:1.5em;display:grid;gap:6px}
.pics{font-size:1.5rem;letter-spacing:.08em}
.bank{background:var(--chip);border-radius:6px;padding:6px 12px;font-weight:700;width:fit-content;max-width:100%}
.story{font-style:italic;background:var(--chip);border-radius:6px;padding:10px 14px}
input.blank{font:inherit;color:var(--accent);background:transparent;border:0;border-bottom:2px dotted var(--muted);width:9em;max-width:100%;padding:0 4px}
input.blank.s{width:3.2em;text-align:center}
input.blank.l{width:min(22em,100%)}
input.box{font:700 1rem var(--body);width:1.8em;height:1.6em;text-align:center;border:2px solid var(--muted);border-radius:4px;background:transparent;color:var(--accent)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.opt{cursor:pointer;border-radius:999px;padding:0 6px;border:2px solid transparent;font-weight:700}
.opt.on{border-color:var(--accent);color:var(--accent)}
.tw{overflow-x:auto}
table{border-collapse:collapse;min-width:280px}
th,td{border:1px solid var(--rule);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--chip);font-family:var(--display)}
td.empty{height:2.2em;min-width:7em}
.draw{border:2px dashed var(--rule);border-radius:8px;min-height:180px;display:grid;place-items:center;color:var(--muted);font-size:.9rem}
details{border-top:2px dashed var(--rule);padding-top:14px}
summary{cursor:pointer;font:800 1.1rem var(--display);color:var(--accent)}
.key{margin-top:10px}
.key td:first-child{font-variant-numeric:tabular-nums;font-weight:700;width:3em;text-align:center}
.hint{color:var(--muted);font-size:.9rem;margin:0}
.reset{justify-self:start;font:700 .95rem var(--display);background:transparent;color:var(--muted);border:2px solid var(--rule);border-radius:999px;padding:4px 14px;cursor:pointer}
@media print{nav,.reset,header p,.hint{display:none}body{background:#fff;color:#000}.sheet{border:0}details{display:none}}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .15s}}
</style>

let uid=0;
function fill(html,tid){
  return html
    .replace(/\[DRAW\]/g,'<div class="draw">✏️ Draw here (on paper or in this box when printed)</div>')
    .replace(/___(L|s)?/g,(m,k)=>`<input class="blank${k==='L'?' l':k==='s'?' s':''}" id="${tid}-i${++uid}" aria-label="answer" autocomplete="off">`)
    .replace(/\( \)/g,()=>`<input class="box" id="${tid}-b${++uid}" maxlength="1" aria-label="answer box" autocomplete="off">`)
    .replace(/\(([^()<>]*\/[^()<>]*)\)/g,(m,inner)=>'( '+inner.split('/').map(o=>`<span class="opt" role="button" tabindex="0">${o.trim()}</span>`).join(' / ')+' )');
}
const stage=document.getElementById('stage'),tabs=document.getElementById('tabs');
T.forEach((t,i)=>{
  const b=document.createElement('button');
  b.role='tab';b.id='tab-'+t.id;b.textContent='Test '+t.id.toUpperCase();
  b.style.setProperty('--tc',`var(${t.color})`);
  b.onclick=()=>show(t.id);tabs.appendChild(b);
  const s=document.createElement('section');
  s.className='sheet';s.id='sheet-'+t.id;s.hidden=true;s.setAttribute('role','tabpanel');
  s.style.setProperty('--accent',`var(${t.color})`);
  s.innerHTML=`<h2>${t.title}</h2>
  <div class="meta"><label>Name: <input class="blank l" id="${t.id}-name" aria-label="Name" autocomplete="off"></label><label>Date: <input class="blank" id="${t.id}-date" aria-label="Date" autocomplete="off"></label></div>
  <p class="hint">Tap a word in brackets to circle it. Tap it again to remove the circle.</p>
  ${t.acts.map((a,j)=>`<div class="act"><h3><span class="n">${j+1}</span>${a[0]}</h3>${fill(a[1],t.id)}</div>`).join('')}
  <button class="reset" type="button">Clear my answers</button>
  <details><summary>Answer Key – Test ${t.id.toUpperCase()}</summary><div class="key tw"><table><tr><th>#</th><th>Answers</th></tr>${t.key.map(k=>`<tr><td>${k[0]}</td><td>${k[1]}</td></tr>`).join('')}</table><p class="hint">Open answers and drawings are correct when the structure or position is right.</p></div></details>`;
  s.querySelector('.reset').onclick=()=>{s.querySelectorAll('input').forEach(x=>x.value='');s.querySelectorAll('.opt.on').forEach(x=>x.classList.remove('on'))};
  stage.appendChild(s);
});
stage.addEventListener('click',e=>{const o=e.target.closest('.opt');if(o)o.classList.toggle('on')});
stage.addEventListener('keydown',e=>{const o=e.target.closest('.opt');if(o&&(e.key==='Enter'||e.key===' ')){e.preventDefault();o.classList.toggle('on')}});
function show(id){
  T.forEach(t=>{const on=t.id===id;document.getElementById('sheet-'+t.id).hidden=!on;document.getElementById('tab-'+t.id).setAttribute('aria-selected',on)});
  try{localStorage.setItem('ws-tab',id)}catch(e){}
}
let start=(location.hash||'').slice(1).toLowerCase();
if(!T.some(t=>t.id===start)){try{start=localStorage.getItem('ws-tab')||'a'}catch(e){start='a'}}
if(!T.some(t=>t.id===start))start='a';
show(start);
</script>
